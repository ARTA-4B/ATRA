name: gateway

on:
  push:
    branches: ["**"]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway.yml"
  workflow_dispatch:

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Typecheck, lint and test only. Deploying is a deliberate human step
# (`wrangler deploy --env staging|production` with the account's credentials);
# nothing in CI holds a Cloudflare token.
jobs:
  gateway:
    name: gateway (lint, typecheck, test, config)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gateway

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gateway/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Format check
        run: pnpm run format:check

      # Runs inside workerd with a local D1, the Hub Durable Object and real
      # WebSockets. api.telegram.org is stubbed; the suite never reaches the
      # network.
      - name: Test
        run: pnpm run test

      # Validates wrangler.jsonc for both environments and bundles the Worker
      # without uploading anything (no credentials are needed for a dry run).
      - name: Bundle (dry run, no deploy)
        run: |
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run-staging --env staging
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run-production --env production
