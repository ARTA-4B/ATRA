# ATRA, self-hosted.
#
#   git clone <repository> && cd ATRA && docker compose up -d
#
# Then open http://127.0.0.1:3000 and complete first-run setup.
#
# The port is published to 127.0.0.1 only. ATRA holds wallet keys, so exposing
# it to a LAN or the internet is a deliberate decision an operator has to make
# on purpose — change the mapping to "3000:3000" and put a real authenticating
# proxy in front of it if you need remote access.

services:
  atra:
    build:
      context: .
      args:
        WITH_FRONTEND: "1"
    image: atra/runtime:local
    container_name: atra
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    # The encrypted vault and the SQLite database live here. Back this volume up
    # and you have backed up the wallet; lose it without an export and the funds
    # are unreachable.
    volumes:
      - atra-data:/data

    env_file:
      - path: .env
        required: false

    environment:
      NODE_ENV: production
      ATRA_HOST: 0.0.0.0
      ATRA_PORT: "3000"
      ATRA_DATA_DIR: /data
      ATRA_LOG_PRETTY: "0"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Long enough for the runtime to finish an in-flight request, lock the vault
    # and checkpoint the database.
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    # The image needs nothing writable outside /data and the temp dir.
    read_only: true
    tmpfs:
      - /tmp

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  atra-data:
    name: atra-data
